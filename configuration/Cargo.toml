[package]
name = "configuration"
version = "0.2.3"
edition.workspace = true
rust-version = "1.88"
description = "Configuration structs, defaults and validation rules for the Catalog MCP server."
license-file = "../LICENSE"
publish = false

[features]
default = []
json-schema = ["dep:schemars"]

[dependencies]
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
url.workspace = true

[dev-dependencies]
rstest = "0.26.1"

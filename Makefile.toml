[tasks.run]
workspace = false
env = { RUSTFLAGS = "-Awarnings" }
command = "cargo"
args = ["run", "--all-features", "${@}"]

[tasks.dev]
workspace = false
env = { RUSTFLAGS = "-Awarnings" }
command = "cargo"
args = ["run", "--all-features", "--", "--config-folder", ".dev"]

[tasks.help]
workspace = false
env = { RUSTFLAGS = "-Awarnings" }
command = "cargo"
args = ["run", "--all-features", "--", "--help"]

[tasks.build]
workspace = false
env = { RUSTFLAGS = "-Awarnings" }
command = "cargo"
args = ["build", "--all-features"]

########################################################################################################################

[env]
docker_compose_dev_file = ".dev/docker-compose.yml"
catalog_engine_oas_source = "../../../gitlab/platform/catalog/catalog-engine/assets/oas/catalog-engine.openapi.json"

[tasks.dev_up]
workspace = false
command = "docker"
args = ["compose", "--file", "${docker_compose_dev_file}", "up", "--wait", "-d"]

[tasks.dev_down]
workspace = false
command = "docker"
args = ["compose", "--file", "${docker_compose_dev_file}", "down", "--remove-orphans", "-v"]

########################################################################################################################

# Refreshes the vendored engine OpenAPI document the contract tests read (§12.3). Pinned on
# purpose: it is refreshed deliberately, in a reviewable diff, never fetched at build time.
[tasks.refresh_oas]
workspace = false
script = '''
    set -e
    if [ ! -f "${catalog_engine_oas_source}" ]; then
        echo "cannot find the engine OAS at ${catalog_engine_oas_source}"
        echo "set catalog_engine_oas_source to a checkout of catalog-engine and try again"
        exit 1
    fi
    cp "${catalog_engine_oas_source}" ./assets/oas/catalog-engine.openapi.json
    echo "vendored assets/oas/catalog-engine.openapi.json from ${catalog_engine_oas_source}"
'''

########################################################################################################################

[tasks.docker_build]
workspace = false
command = "docker"
args = ["build", "--tag=ghcr.io/mia-platform/catalog-mcp-server:latest", "."]

[tasks.docker_run]
workspace = false
command = "docker"
args = [
    "run",
    "--rm",
    "-it",
    "--name=catalog-mcp-server",
    "--publish=8000:8000",
    "--volume=${PWD}/.dev/config.json:/home/catalog-mcp-server/.config/catalog-mcp-server/config.json",
    "ghcr.io/mia-platform/catalog-mcp-server:latest",
    "${@}"
]

########################################################################################################################

[tasks.test_local]
workspace = false
env = { RUSTFLAGS = "-Awarnings" }
command = "cargo"
args = ["test", "--all-features", "${@}", "--", "--show-output"]

########################################################################################################################

[tasks.fmt]
workspace = false
script = "cargo +nightly fmt --all --check"

[tasks.clippy]
workspace = false
command = "cargo"
args = ["clippy", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.test]
workspace = false
command = "cargo"
args = ["test", "--all-features"]

# The blocking CI gate (§3.3): nightly `fmt --check`, then clippy with `-D warnings`, then the
# tests. Clippy is blocking here, as in `ai-foundry-bff`, not advisory as in `catalog-engine`.
[tasks.check_all]
workspace = false
dependencies = ["fmt", "clippy", "test"]

[tasks.udeps_all]
workspace = false
install_crate = { crate_name = "cargo-udeps", binary = "cargo-udeps", test_arg = "--help" }
toolchain = "nightly"
script = '''
    echo "\nChecking for unused dependencies..."
    cargo +nightly udeps --all-targets --all-features

    echo "\n✓ All valid feature combinations checked for unused dependencies!"
'''

########################################################################################################################

# The protocol conformance gate (§12.2). Green on both revisions is a release gate.
[tasks.conformance]
workspace = false
script = "tests/conformance/run.sh"

# Same, writing the per-check results under tests/conformance/results/ for inspection when a
# baseline entry has to be added or removed.
[tasks.conformance_record]
workspace = false
script = "tests/conformance/run.sh --record"

# The byte goldens and the `tools/list` ceiling (§12.4, D12). Prints the per-tool table whether
# it passes or fails, so growth is always attributable.
[tasks.budget]
workspace = false
command = "cargo"
args = ["test", "--all-features", "registry::tests", "--", "--show-output"]

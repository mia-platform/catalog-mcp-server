name: Check & lint

on:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          show-progress: false
      
      - name: Format
        run: |
          rustup component add --toolchain nightly rustfmt
          cargo +nightly fmt --all --check

      - name: Checks
        run: |
          rustup component add --toolchain nightly rustfmt
          rustup component add clippy
          sh .ci/install-cargo-make.sh
          sh .ci/install-cargo-udeps.sh
          cargo make udeps_all
          cargo make check_all

      # The `tools/list` ceiling and the per-tool byte goldens (core §12.4, D12). Prints the
      # per-tool table whether it passes or fails, so growth is always attributable.
      - name: Byte budget
        run: cargo make budget

      # The official conformance suite against our own binary, on both protocol revisions
      # (core §12.2). The SDK passes it on its own; this proves our handler does not break it,
      # and it is the alarm that fires when an SDK upgrade changes behaviour under us.
      - name: Use Node 22
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'

      - name: Protocol conformance
        run: cargo make conformance

      - name: Use golang 1.20
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.20'

      - name: Install addlicense
        run: go install github.com/google/addlicense@latest

      - name: Check license
        run: |
          addlicense -c 'Mia srl' -check -s \
            $(find src configuration catalog-client tests build.rs -name '*.rs')

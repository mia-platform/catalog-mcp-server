name: Nightly

# The `nightly` image, rebuilt for every commit pushed or merged to `nightly` and published to
# ghcr.io and nexus only. It is one moving tag: it is always the latest nightly build.
on:
  push:
    branches:
      - nightly
      # Temporary: nightly images from the rewrite branch until it is merged. Remove this line then.
      - feat/full-mcp-rewrite
  pull_request:
    branches:
      - nightly

# Pushes queue rather than cancel, so every commit is checked and the last one to finish is the
# image `nightly` points at.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/_checks.yml

  build:
    uses: ./.github/workflows/_build.yml

  docker-build:
    if: github.event_name == 'push'
    needs:
      - checks
      - build
    uses: ./.github/workflows/_release-docker.yml
    with:
      nightly: true
    secrets:
      docker_username: ${{ secrets.BOT_DOCKER_USERNAME }}
      docker_token: ${{ secrets.BOT_DOCKER_TOKEN }}
      nexus_username: ${{ secrets.NEXUS_USER }}
      nexus_token: ${{ secrets.NEXUS_TOKEN }}
      sysdig_token: ${{ secrets.SYSDIG_SECURE_TOKEN }}

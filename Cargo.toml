[workspace]
resolver = "3"

[workspace.package]
edition = "2024"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

[package]
name = "catalog-mcp-server"
version = "0.2.2"
authors = ["Mia-Platform core team"]
edition.workspace = true
description = "A Model Context Protocol server to integrate with Mia-Platform Catalog APIs."
documentation = "https://docs.mia-platform.eu/"
homepage = "https://mia-platform.eu/"
repository = "https://github.com/mia-platform/catalog-mcp-server"
license-file = "./LICENSE"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.6", default-features = false, features = [
    "http1",
    "http2",
    "json",
    "tokio",
] }
clap = { version = "4.5.53", features = ["derive"] }
futures = "0.3.31"
http = "1.4.0"
oas3 = "0.22.0"
once_cell = "1.21.3"
reqwest = { version = "0.12.28", features = ["json"] }
rmcp = { version = "1.0.0", features = ["server", "transport-streamable-http-server", "transport-io"] }
rmcp-openapi = "0.26.6"
serde = "1.0.228"
serde_json = "1.0.145"
serde_path_to_error = "0.1.20"
serde_yaml = "0.9"
tokio = { version = "1.48.0", features = ["rt", "signal", "fs"] }
tokio-util = "0.7.17"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = [
    "cors",
    "normalize-path",
    "request-id",
    "trace",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = [
    "env-filter",
    "fmt",
    "json",
] }
url = "2.5.7"
uuid = "1.19.0"

[package.metadata.release]
pre-release-commit-message = "'catalog-mcp-server' tagged at version '{{version}}'"
pre-release-replacements = []
publish = false
push = false
tag-message = "catalog-mcp-server tagged at version {{version}}"
tag-name = "v{{version}}"

[workspace]
resolver = "3"
members = ["catalog-client", "configuration"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
http = "1.4.0"
metrics = "0.24.2"
regex = "1.12.3"
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "http2",
    "rustls-tls",
] }
rstest = "0.26.1"
schemars = "1.0.4"
serde = { version = "1.0.228", features = ["derive"] }
# `preserve_order`: a `Value` keeps its keys in insertion order instead of sorting them, so a
# tool's payload reaches the model in the order its output struct declares — `kind` before a
# long `description` (T1 §4). Every tool's output is a `Value`, so this is the one place it can be
# decided, and it changes key order only, never bytes.
serde_json = { version = "1.0.145", features = ["preserve_order"] }
tokio = "1.48.0"
tracing = "0.1.41"
url = "2.5.7"
uuid = "1.19.0"
zeroize = { version = "1.8.2", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

[package]
name = "catalog-mcp-server"
version = "0.2.3"
authors = ["Mia-Platform core team"]
edition.workspace = true
rust-version = "1.88"
description = "A Model Context Protocol server to integrate with Mia-Platform Catalog APIs."
documentation = "https://docs.mia-platform.eu/"
homepage = "https://mia-platform.eu/"
repository = "https://github.com/mia-platform/catalog-mcp-server"
license-file = "./LICENSE"

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.6", default-features = false, features = [
    "http1",
    "http2",
    "json",
    "tokio",
] }
catalog-client = { path = "catalog-client" }
clap = { version = "4.5.53", features = ["derive", "env"] }
configuration = { path = "configuration" }
dirs = "6.0.0"
http.workspace = true
http-body-util = "0.1.3"
metrics.workspace = true
metrics-exporter-prometheus = { version = "0.17.2", default-features = false }
rmcp = { version = "3.4.0", features = ["transport-streamable-http-server"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1.20"
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }

tokio-util = "0.7.17"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["normalize-path", "request-id"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.20", features = [
    "env-filter",
    "fmt",
    "json",
] }

[build-dependencies]
configuration = { path = "./configuration", features = ["json-schema"] }
schemars.workspace = true
serde_json.workspace = true

[dev-dependencies]
base64.workspace = true
tracing-subscriber = { version = "0.3.20", features = ["registry"] }
tokio = { workspace = true, features = ["test-util"] }
catalog-client = { path = "catalog-client", features = ["testing"] }
rstest.workspace = true
wiremock = "0.6.5"


[package.metadata.release]
pre-release-commit-message = "'catalog-mcp-server' tagged at version '{{version}}'"
pre-release-replacements = []
publish = false
push = false
tag-message = "catalog-mcp-server tagged at version {{version}}"
tag-name = "v{{version}}"

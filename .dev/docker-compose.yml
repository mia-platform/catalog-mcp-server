# The local development environment: a real `catalog-engine` on postgres, for trying the server
# by hand. The server itself runs on the host (`cargo run -- --config-folder .dev`), so the
# edit-and-rerun loop stays fast. See CONTRIBUTING.md.
#
# Deliberately separate from `tests/docker-compose.yml`: e2e wants throwaway state and may change
# for test reasons, while this one keeps its data across restarts and holds stable ports. What the
# two share is the engine version, which is also the one `catalog-helm-chart` deploys.
#
# There is no gateway, so whatever calls the server must send `x-mia-acl-context` itself. The
# engine registers a tenant the first time it sees one in that header, so there is nothing to
# seed: its own type definitions and AI items are provisioned on first start.

name: catalog-mcp-server-dev

services:
  postgres:
    image: docker.io/postgres:18-alpine
    container_name: postgres4catalog-mcp-server-dev
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=""
      - POSTGRES_DB=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      # Postgres 18 keeps its data under a versioned subdirectory of this path, which is why the
      # volume is mounted here rather than at the pre-18 `/var/lib/postgresql/data`.
      - pg-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 2s
      timeout: 5s
      retries: 15

  catalog-engine:
    image: nexus.mia-platform.eu/catalog/catalog-engine:0.9.4
    platform: linux/amd64
    pull_policy: if_not_present
    container_name: catalog-engine4catalog-mcp-server-dev
    ports:
      - "3000:3000"
    environment:
      - LOG_LEVEL=info
      - CONFIGURATION_FOLDER=/config
    volumes:
      - ./catalog-engine/config.json:/config/config.json:ro
    networks:
      - ring
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/-/ready | grep -q OK"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data:
    name: catalog-mcp-server-dev-pg-data

networks:
  ring:

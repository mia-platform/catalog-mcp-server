# The one route `catalog-engine` calls for its tenant listing, answered from a static file.
events {}

http {
    server {
        listen 8080;

        location = /api/authz/tenants {
            default_type application/json;
            alias /usr/share/nginx/stub/tenants.json;
        }

        location / {
            return 404;
        }
    }
}

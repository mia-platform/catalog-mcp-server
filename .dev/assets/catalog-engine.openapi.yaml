openapi: 3.1.0
info:
  title: catalog-engine
  description: The backend service powering up the Mia-Platform Catalog.
  contact:
    name: Mia-Platform core team
  license:
    name: ''
  version: 0.4.1

paths:
  /api/catalog/items:
    get:
      tags:
        - items
      summary: List items
      description: >-
        List all Catalog items across all groups and versions.

        Use this to browse the full Catalog without filtering by group/family. For group-specific browsing, prefer the `list_items_by_itd` tool.

        The following item types are not returned by this tool, use the `list_items_by_itd` if you need them:
          - Relationships (group `mia-platform.eu`, version `v1alpha1`, family `relationships`)
          - Relationship Types (group `mia-platform.eu`, version `v1alpha1`, family `relationship-types`)
          - Relationship Constraints (group `mia-platform.eu`, version `v1alpha1`, family `relationship-constraints`)
          - Custom Fields (group `mia-platform.eu`, version `v1alpha1`, family `custom fields`)

        Args:
          - limit: Maximum number of items to return (1-200)
          - continue_token: Server-generated token for paginated requests
          - rawq: URL-safe base64 encoded JSON query for complex filtering
          - sort: Field to sort by. Sorting can be performed on: `metadata.creationTimestamp`, `metadata.updateTimestamp`, `metadata.name`, `metadata.title`. Prefix with '-' for descending
          - header_Accept: Desired response format between full object (`application/json`, `application/*`, `*/*`), or partial object that includes only metadata (`application/json;as=PartialObjectMetadata`). Request the partial object to limit the response size when you just need information to identify the items. Then, use the `get_item_by_name` tool to get the full manifest of a specific item.

        Returns:
           List of catalog items
      operationId: list_items
      parameters:
        - name: limit
          in: query
          description: The maximum number of items to return.
          required: false
          schema:
            type: integer
            format: int64
            default: 50
            maximum: 200
            minimum: 1
        - name: continue
          in: query
          description: >-
            The server-generated token to retrieve more results in a paginated
            request.
          required: false
          schema:
            type:
              - string
              - 'null'
        - name: rawq
          in: query
          description: >-
            Queries made with the `rawq` are expressed as JSON objects written
            in a Catalog-specific query language.

            They must be sent in the URL as [URL-safe
            base64](https://developer.mozilla.org/en-US/docs/Glossary/Base64#url_and_filename_safe_base64)
            encoded strings.

            Multiple `rawq` parameters can be specified, and they are chained in
            *AND* with each other and with the other filtering query parameters.


            Fields that can be queried include:


            - `apiVersion`

            - `kind`

            - `metadata.name`

            - `metadata.labels`

            - `metadata.title`

            - `metadata.tags`

            - any selectable field in `spec`
          required: false
          schema:
            type: array
            items:
              type: string
        - name: sort
          in: query
          description: >-
            The field by which results should be sorted.


            The default sorting order is ascending lexicographical order.

            If the field name is prefixed by a `-`, then descending
            lexicographical order will be applied.


            Specifying the query parameter multiple times means that the results
            will be sorted for multiple fields, with the sort order evaluated
            from the first-appearing query parameter to the last.


            Sorting can be performed on:


            - `metadata.creationTimestamp`

            - `metadata.updateTimestamp`

            - `metadata.name`

            - `metadata.title`


            *Example* : -metadata.name
          required: false
          schema:
            type: array
            items:
              type: string
        - name: Accept
          in: header
          description: >-
            Specifies the desired response format. Supported values are:

            - `application/json` (equivalent to `application/*`, `*/*`, or an
            absent `Accept` header) for a full object response,

            - `application/json;as=PartialObjectMetadata` for a partial response
            that includes only metadata.
          required: false
          schema:
            type: string
            enum:
              - application/json;as=PartialObjectMetadata
              - application/json
              - application/*
              - '*/*'
        - name: x-catalog-org
          in: header
          description: >-
            Identifier of the organization in the context of which the action
            should be performed.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Requested list provided.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/miaplatform.eu.v1alpha1.List_miaplatform.eu.v1alpha1.Item
            application/json;as=PartialObjectMetadata:
              schema:
                $ref: >-
                  #/components/schemas/miaplatform.eu.v1alpha1.List_miaplatform.eu.v1alpha1.PartialObjectMetadata
        '400':
          description: Request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        '406':
          description: Accept header value is not supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        5XX:
          description: Server-side error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
  
  /api/catalog/items/count:
    get:
      tags:
        - items
      summary: Count items
      description: >-
        Count all Catalog items across all groups and versions, with optional filtering.

        Use this to get a total item count without fetching the full list. For counting items of a specific type, apply a `rawq` filter. To list items, use `list_items` or `list_items_by_itd`.

        The following item types are not counted by this tool:
          - Relationships (group `mia-platform.eu`, version `v1alpha1`, family `relationships`)
          - Relationship Types (group `mia-platform.eu`, version `v1alpha1`, family `relationship-types`)
          - Relationship Constraints (group `mia-platform.eu`, version `v1alpha1`, family `relationship-constraints`)
          - Custom Fields (group `mia-platform.eu`, version `v1alpha1`, family `custom-fields`)

        Args:
          - rawq: URL-safe base64 encoded JSON query for complex filtering

        Returns:
          Object with a single `count` field containing the total number of matching items
      operationId: count_items
      parameters:
        - name: rawq
          in: query
          description: >-
            A selector to restrict the counted items by a complex query on their
            labels and fields.


            Queries made with the `rawq` are expressed as JSON objects written
            in a Catalog-specific query language.

            They must be sent in the URL as [URL-safe
            base64](https://developer.mozilla.org/en-US/docs/Glossary/Base64#url_and_filename_safe_base64)
            encoded strings.

            Multiple `rawq` parameters can be specified, and they are chained in
            *AND* with each other and with the other filtering query parameters.


            Fields that can be queried include:


            - `apiVersion`

            - `kind`

            - `metadata.name`

            - `metadata.labels`

            - `metadata.title`

            - `metadata.tags`

            - any selectable field in `spec`
          required: false
          schema:
            type: array
            items:
              type: string
        - name: x-catalog-org
          in: header
          description: >-
            Identifier of the organization in the context of which the action
            should be performed.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Requested count provided.
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                properties:
                  count:
                    type: integer
                    format: int64
                    minimum: 0
        '400':
          description: Request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        5XX:
          description: Server-side error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
  
  /api/catalog/mia-platform.eu/v1alpha1/item-type-definitions:
    get:
      tags:
        - item-type-definitions
      summary: List Item Type Definitions
      description: >-
        List all Item Type Definitions (ITDs) registered in the Catalog.

        Use this to discover what item types are available before fetching items. Each ITD defines a custom resource type whose `spec.group`, `spec.names.plural`, and `spec.versions[].name` fields provide the `group`, `family`, and `version` values required by `list_items_by_itd`, `get_item_by_name`, `upsert_item`, and `delete_item_by_name`.

        Args:
          - limit: Maximum number of ITDs to return (1-200)
          - continue_token: Server-generated token for paginated requests
          - label: Label selector (e.g., `env=production`). Repeatable, chained in AND
          - field: Field selector (e.g., `spec.group=mia-platform.eu`). Filterable fields: `metadata.name`, `metadata.title`, `metadata.tags`, `spec.scope`, `spec.group`, `spec.names.kind`, `spec.names.plural`. Repeatable, chained in AND
          - rawq: URL-safe base64 encoded JSON query for complex filtering
          - sort: Field to sort by. Sorting can be performed on: `metadata.creationTimestamp`, `metadata.updateTimestamp`, `metadata.name`, `metadata.title`. Prefix with '-' for descending
          - header_Accept: Desired response format between full object (`application/json`, `application/*`, `*/*`), or partial object that includes only metadata (`application/json;as=PartialObjectMetadata`). Request the partial object to limit the response size when you just need to identify ITDs.

        Returns:
          Paginated list of Item Type Definitions
      operationId: list_itds
      parameters:
        - name: limit
          in: query
          description: The maximum number of items to return.
          required: false
          schema:
            type: integer
            format: int64
            default: 50
            maximum: 200
            minimum: 1
        - name: continue
          in: query
          description: >-
            The server-generated token to retrieve more results in a paginated
            request.
          required: false
          schema:
            type:
              - string
              - 'null'
        - name: label
          in: query
          description: >-
            A selector to restrict the list of returned Item Type Definitions by
            their labels.


            The `label` query parameter can contain only a single selector.

            To add more selectors, you can specify the parameter multiple times
            in the same request.

            The selectors will be chained in *AND*.


            *Example* : env=production
          required: false
          schema:
            type: array
            items:
              type: string
        - name: field
          in: query
          description: >-
            A selector to restrict the list of returned Item Type Definitions by
            their fields.


            The `field` query parameter can contain only a single selector.

            To add more selectors, you can specify the parameter multiple times
            in the same request.

            The selectors will be chained in *AND*.


            Fields that can be queried include:


            - `metadata.name`

            - `metadata.title`

            - `metadata.tags`

            - `spec.scope`

            - `spec.group`

            - `spec.names.kind`

            - `spec.names.plural`


            *Example* : spec.group=mia-platform.eu
          required: false
          schema:
            type: array
            items:
              type: string
        - name: rawq
          in: query
          description: >-
            A selector to restrict the list of returned Item Type Definitions by
            a complex query on their labels and fields.


            Queries made with the `rawq` are expressed as JSON objects written
            in a Catalog-specific query language.

            They must be sent in the URL as [URL-safe
            base64](https://developer.mozilla.org/en-US/docs/Glossary/Base64#url_and_filename_safe_base64)
            encoded strings.

            Multiple `rawq` parameters can be specified, and they are chained in
            *AND* with each other and with the other filtering query parameters.


            Fields that can be queried include:


            - `metadata.name`

            - `metadata.labels`

            - `metadata.title`

            - `metadata.tags`

            - `spec.scope`

            - `spec.group`

            - `spec.names.kind`

            - `spec.names.plural`
          required: false
          schema:
            type: array
            items:
              type: string
        - name: sort
          in: query
          description: >-
            The field by which results should be sorted.


            The default sorting order is ascending lexicographical order. If the
            field name is prefixed by a `-`, than descending lexicographical
            order will be applied.


            Specifying the query parameter multiple times means that the results
            will be sorted for multiple fields, with the sort order evaluated
            from the first-appearing query parameter to the last.


            Sorting can be performed on:


            - `metadata.creationTimestamp`

            - `metadata.updateTimestamp`

            - `metadata.name`

            - `metadata.title`


            *Example* : -metadata.name
          required: false
          schema:
            type: array
            items:
              type: string
        - name: Accept
          in: header
          description: >-
            Specifies the desired response format. Supported values are:

            - `application/json` (equivalent to `application/*`, `*/*`, or an
            absent `Accept` header) for a full object response,

            - `application/json;as=PartialObjectMetadata` for a partial response
            that includes only metadata.
          required: false
          schema:
            type: string
            enum:
              - application/json;as=PartialObjectMetadata
              - application/json
              - application/*
              - '*/*'
        - name: x-catalog-org
          in: header
          description: >-
            Identifier of the organization in the context of which the action
            should be performed.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Requested list provided.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/miaplatform.eu.v1alpha1.List_miaplatform.eu.v1alpha1.ItemTypeDefinition
        '400':
          description: Request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        '406':
          description: Accept header value is not supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        5XX:
          description: Server-side error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
  
  /api/catalog/mia-platform.eu/v1alpha1/item-type-definitions/count:
    get:
      tags:
        - item-type-definitions
      summary: Count Item Type Definitions
      description: >-
        Count all Item Type Definitions (ITDs) registered in the Catalog, with optional filtering.

        Use this to get the total number of ITDs without fetching the full list. To list ITDs and inspect their schemas, use `list_itds`.

        Args:
          - label: Label selector (e.g., `env=production`). Repeatable, chained in AND
          - field: Field selector (e.g., `spec.group=mia-platform.eu`). Filterable fields: `metadata.name`, `metadata.title`, `metadata.tags`, `spec.scope`, `spec.group`, `spec.names.kind`, `spec.names.plural`. Repeatable, chained in AND
          - rawq: URL-safe base64 encoded JSON query for complex filtering

        Returns:
          Object with a single `count` field containing the total number of matching ITDs
      operationId: count_itds
      parameters:
        - name: label
          in: query
          description: >-
            A selector to restrict the counted Item Type Definitions by their
            labels.


            The `label` query parameter can contain only a single selector.

            To add more selectors, you can specify the parameter multiple times
            in the same request.

            The selectors will be chained in *AND*.


            *Example* : env=production
          required: false
          schema:
            type: array
            items:
              type: string
        - name: field
          in: query
          description: >-
            A selector to restrict the counted Item Type Definitions by their
            fields.


            The `field` query parameter can contain only a single selector.

            To add more selectors, you can specify the parameter multiple times
            in the same request.

            The selectors will be chained in *AND*.


            Fields that can be queried include:


            - `metadata.name`

            - `metadata.title`

            - `metadata.tags`

            - `spec.scope`

            - `spec.group`

            - `spec.names.kind`

            - `spec.names.plural`


            *Example* : spec.group=mia-platform.eu
          required: false
          schema:
            type: array
            items:
              type: string
        - name: rawq
          in: query
          description: >-
            A selector to restrict the counted Item Type Definitions by a
            complex query on their labels and fields.


            Queries made with the `rawq` are expressed as JSON objects written
            in a Catalog-specific query language.

            They must be sent in the URL as [URL-safe
            base64](https://developer.mozilla.org/en-US/docs/Glossary/Base64#url_and_filename_safe_base64)
            encoded strings.

            Multiple `rawq` parameters can be specified, and they are chained in
            *AND* with each other and with the other filtering query parameters.


            Fields that can be queried include:


            - `metadata.name`

            - `metadata.labels`

            - `metadata.title`

            - `metadata.tags`

            - `spec.scope`

            - `spec.group`

            - `spec.names.kind`

            - `spec.names.plural`
          required: false
          schema:
            type: array
            items:
              type: string
        - name: x-catalog-org
          in: header
          description: >-
            Identifier of the organization in the context of which the action

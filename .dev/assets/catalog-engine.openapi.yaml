          required: false
          schema:
            type: string
      responses:
        '200':
          description: Requested count provided.
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                properties:
                  count:
                    type: integer
                    format: int64
                    minimum: 0
        '400':
          description: Request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        5XX:
          description: Server-side error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
  
  '/api/catalog/mia-platform.eu/v1alpha1/item-type-definitions/{name}':
    get:
      tags:
        - item-type-definitions
      summary: Get Item Type Definition by name
      description: >-
        Retrieve a single Item Type Definition (ITD) by its unique name.

        Use this to inspect the full schema and configuration of a specific item type. The ITD's `spec.group`, `spec.names.plural`, and `spec.versions[].name` fields provide the `group`, `family`, and `version` values needed by `list_items_by_itd`, `get_item_by_name`, `upsert_item`, and `delete_item_by_name`.

        Args:
          - name: The `metadata.name` of the ITD (e.g., `dockerimages.stable.example.com`)
          - header_Accept: Desired response format between full object (`application/json`, `application/*`, `*/*`), or partial object that includes only metadata (`application/json;as=PartialObjectMetadata`)

        Returns:
          The requested Item Type Definition, or 404 if not found
      operationId: get_itd_by_name
      parameters:
        - name: name
          in: path
          description: |-
            The name of the resource.

            It corresponds to the `metadata.name` field of the resource.
          required: true
          schema:
            type: string
          example: dockerimages.stable.example.com
        - name: Accept
          in: header
          description: >-
            Specifies the desired response format. Supported values are:

            - `application/json` (equivalent to `application/*`, `*/*`, or an
            absent `Accept` header) for a full object response,

            - `application/json;as=PartialObjectMetadata` for a partial response
            that includes only metadata.
          required: false
          schema:
            type: string
            enum:
              - application/json;as=PartialObjectMetadata
              - application/json
              - application/*
              - '*/*'
        - name: x-catalog-org
          in: header
          description: >-
            Identifier of the organization in the context of which the action
            should be performed.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Requested Item Type Definition provided.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/miaplatform.eu.v1alpha1.ItemTypeDefinition
            application/json;as=PartialObjectMetadata:
              schema:
                $ref: >-
                  #/components/schemas/miaplatform.eu.v1alpha1.PartialObjectMetadata
        '400':
          description: Request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        '404':
          description: Requested Item Type Definition does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        '406':
          description: Accept header value is not supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        5XX:
          description: Server-side error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
    put:
      tags:
        - item-type-definitions
      summary: Create or update an Item Type Definition
      description: >-
        Create a new Item Type Definition (ITD) or update an existing one by name.

        Use this to register a new custom resource type in the Catalog or modify an existing type definition. Creating an ITD enables creating items of that type via `upsert_item`.

        Constraints:
          - `metadata.name` in the body must match the `name` path parameter
          - For updates, `resourceVersion` in the body must match the current stored value to avoid 409 Conflict
          - Read-only fields (e.g., `spec.group`) cannot be changed on update; such modifications are silently ignored and a `Warning` header is returned

        Args:
          - name: The `metadata.name` of the ITD (e.g., `dockerimages.stable.example.com`)
          - body: Full ITD object conforming to the `ItemTypeDefinition` schema

        Returns:
          The created (201) or updated (200) Item Type Definition
      operationId: upsert_itd
      parameters:
        - name: name
          in: path
          description: |-
            The name of the resource.

            It corresponds to the `metadata.name` field of the resource.
          required: true
          schema:
            type: string
          example: dockerimages.stable.example.com
        - name: x-catalog-org
          in: header
          description: >-
            Identifier of the organization in the context of which the action
            should be performed.
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/miaplatform.eu.v1alpha1.ItemTypeDefinition'
        required: true
      responses:
        '200':
          description: Item Type Definition updated successfully.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/miaplatform.eu.v1alpha1.ItemTypeDefinition
        '201':
          description: Item Type Definition created successfully.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/miaplatform.eu.v1alpha1.ItemTypeDefinition
        '400':
          description: Request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        '409':
          description: >-
            Conflict between the resource version in the body and the current
            resource version of the Item Type Definition in case of an update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        5XX:
          description: Server-side error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
    delete:
      tags:
        - item-type-definitions
      summary: Delete Item Type Definition by name
      description: >-
        Delete an Item Type Definition (ITD) and all items of that type by name.

        Use this to permanently remove a custom resource type from the Catalog. WARNING: this is a destructive operation — all items belonging to this ITD will also be deleted. To delete a single item without removing its type, use `delete_item_by_name`.

        Args:
          - name: The `metadata.name` of the ITD to delete (e.g., `dockerimages.stable.example.com`)
          - resourceVersion: Optional concurrency control token. If provided, deletion only proceeds if it matches the current resource version; otherwise returns 409 Conflict

        Returns:
          204 No Content on success, or 404 if the ITD does not exist
      operationId: delete_itd_by_name
      parameters:
        - name: name
          in: path
          description: |-
            The name of the resource.

            It corresponds to the `metadata.name` field of the resource.
          required: true
          schema:
            type: string
          example: dockerimages.stable.example.com
        - name: resourceVersion
          in: query
          description: >-
            The resource version for optional concurrency control.


            If provided, the Item Type Definition will be deleted only if its
            current resource version (`resourceVersion` root field) matches the
            given one.

            If they do not match, a `409 Conflict` error will be returned.
          required: false
          schema:
            type:
              - string
              - 'null'
        - name: x-catalog-org
          in: header
          description: >-
            Identifier of the organization in the context of which the action
            should be performed.
          required: false
          schema:
            type: string
      responses:
        '204':
          description: Requested Item Type Definition deleted.
        '400':
          description: Request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        '404':
          description: Requested Item Type Definition does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        '409':
          description: >-
            Conflict between resource version provided in the query parameters
            and the current resource version of the Item Type Definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        5XX:
          description: Server-side error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
  
  '/api/catalog/{group}/{version}/items/{family}':
    get:
      tags:
        - items
      summary: List items of an Item Type Definition
      description: >-
        List all Catalog items of a specific type, identified by group, version, and family.

        Use this for type-specific browsing when you know the item type. To retrieve items across all types, use `list_items` instead. To get the `group`, `version`, and `family` values for a type, look up the ITD via `list_itds` or `get_itd_by_name`.

        This is the only tool that returns the following item types:
          - Relationships (group `mia-platform.eu`, version `v1alpha1`, family `relationships`)
          - Relationship Types (group `mia-platform.eu`, version `v1alpha1`, family `relationship-types`)
          - Relationship Constraints (group `mia-platform.eu`, version `v1alpha1`, family `relationship-constraints`)
          - Custom Fields (group `mia-platform.eu`, version `v1alpha1`, family `custom-fields`)

        Args:
          - group: API group of the item type (e.g., `mia-platform.eu`). Matches `spec.group` of the ITD
          - version: API version of the item type (e.g., `v1alpha1`). Matches `spec.versions[].name` of the ITD
          - family: Plural resource name of the item type (e.g., `services`). Matches `spec.names.plural` of the ITD
          - limit: Maximum number of items to return (1-200)
          - continue_token: Server-generated token for paginated requests
          - label: Label selector (e.g., `env=production`). Repeatable, chained in AND
          - field: Field selector (e.g., `metadata.title!=Foo`). Filterable fields: `metadata.name`, `metadata.title`, `metadata.tags`, and any selectable field in `spec`. Repeatable, chained in AND
          - rawq: URL-safe base64 encoded JSON query for complex filtering
          - sort: Field to sort by. Sorting can be performed on: `metadata.creationTimestamp`, `metadata.updateTimestamp`, `metadata.name`, `metadata.title`. Prefix with '-' for descending
          - header_Accept: Desired response format between full object (`application/json`, `application/*`, `*/*`), or partial object that includes only metadata (`application/json;as=PartialObjectMetadata`). Request the partial object to limit the response size when you just need information to identify the items. Then, use `get_item_by_name` to get the full manifest.

        Returns:
          Paginated list of items of the specified type, or 404 if the ITD does not exist
      operationId: list_items_by_itd
      parameters:
        - name: group
          in: path
          description: >-
            The API group of the item.


            It corresponds to the `spec.group` field of the item's Item Type
            Definition.
          required: true
          schema:
            type: string
          example: mia-platform.eu
        - name: version
          in: path
          description: >-
            The API group version of the item.


            It corresponds to the `spec.version.name` field of the item's Item
            Type Definition.
          required: true
          schema:
            type: string
          example: v1alpha1
        - name: family
          in: path
          description: >-
            The family of the item.


            It corresponds to the `spec.names.plural` field of the item's Item
            Type Definition.
          required: true
          schema:
            type: string
          example: services
        - name: limit
          in: query
          description: The maximum number of items to return.
          required: false
          schema:
            type: integer
            format: int64
            default: 50
            maximum: 200
            minimum: 1
        - name: continue
          in: query
          description: >-
            The server-generated token to retrieve more results in a paginated
            request.
          required: false
          schema:
            type:
              - string
              - 'null'
        - name: label
          in: query
          description: >-
            A selector to restrict the list of returned items by their labels.


            The `label` query parameter can contain only a single selector.

            To add more selectors, you can specify the parameter multiple times
            in the same request.

            The selectors will be chained in *AND*.


            *Example* : env=production
          required: false
          schema:
            type: array
            items:
              type: string
        - name: field
          in: query
          description: >-
            A selector to restrict the list of returned items by their fields.


            The `field` query parameter can contain only a single selector.

            To add more selectors, you can specify the parameter multiple times
            in the same request.

            The selectors will be chained in *AND*.


            Fields that can be queried include:


            - `metadata.name`

            - `metadata.title`

            - `metadata.tags`

            - any selectable field in `spec`


            *Example* : metadata.title!=Foo
          required: false
          schema:
            type: array
            items:
              type: string
        - name: rawq
          in: query
          description: >-
            A selector to restrict the list of returned items by a complex query
            on their labels and fields.


            Queries made with the `rawq` are expressed as JSON objects written
            in a Catalog-specific query language.

            They must be sent in the URL as [URL-safe
            base64](https://developer.mozilla.org/en-US/docs/Glossary/Base64#url_and_filename_safe_base64)
            encoded strings.

            Multiple `rawq` parameters can be specified, and they are chained in
            *AND* with each other and with the other filtering query parameters.


            Fields that can be queried include:


            - `metadata.name`

            - `metadata.labels`

            - `metadata.title`

            - `metadata.tags`

            - any selectable field in `spec`
          required: false
          schema:
            type: array
            items:
              type: string
        - name: sort
          in: query
          description: >-
            The field by which results should be sorted.


            The default sorting order is ascending lexicographical order. If the
            field name is prefixed by a `-`, than descending lexicographical
            order will be applied.


            Specifying the query parameter multiple times means that the results
            will be sorted for multiple fields, with the sort order evaluated
            from the first-appearing query parameter to the last.


            Sorting can be performed on:


            - `metadata.creationTimestamp`

            - `metadata.updateTimestamp`

            - `metadata.name`

            - `metadata.title`


            *Example* : -metadata.name
          required: false
          schema:
            type: array
            items:
              type: string
        - name: Accept
          in: header
          description: >-
            Specifies the desired response format. Supported values are:

            - `application/json` (equivalent to `application/*`, `*/*`, or an
            absent `Accept` header) for a full object response,

            - `application/json;as=PartialObjectMetadata` for a partial response
            that includes only metadata.
          required: false
          schema:
            type: string
            enum:
              - application/json;as=PartialObjectMetadata
              - application/json
              - application/*
              - '*/*'
        - name: x-catalog-org
          in: header
          description: >-
            Identifier of the organization in the context of which the action
            should be performed.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Requested list provided.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/miaplatform.eu.v1alpha1.List_miaplatform.eu.v1alpha1.Item
            application/json;as=PartialObjectMetadata:
              schema:
                $ref: >-
                  #/components/schemas/miaplatform.eu.v1alpha1.List_miaplatform.eu.v1alpha1.PartialObjectMetadata
        '400':
          description: Request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        '404':
          description: Requested items' Item Type Definition does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        '406':
          description: Accept header value is not supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        5XX:
          description: Server-side error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
  
  '/api/catalog/{group}/{version}/items/{family}/{name}':
    get:
      tags:
        - items
      summary: Get item by name
      description: >-
        Retrieve a single Catalog item by its type coordinates and unique name.

        Use this to fetch the full manifest of a specific item when you already know its type (group, version, family) and name. If you only have partial information, first use `list_items` or `list_items_by_itd` with `header_Accept: application/json;as=PartialObjectMetadata` to identify the item, then call this tool for the full detail.

        Args:
          - group: API group of the item type (e.g., `mia-platform.eu`). Matches `spec.group` of the ITD
          - version: API version of the item type (e.g., `v1alpha1`). Matches `spec.versions[].name` of the ITD
          - family: Plural resource name of the item type (e.g., `services`). Matches `spec.names.plural` of the ITD
          - name: The `metadata.name` of the item (e.g., `my-service`)
          - header_Accept: Desired response format between full object (`application/json`, `application/*`, `*/*`), or partial object that includes only metadata (`application/json;as=PartialObjectMetadata`)

        Returns:
          The requested item, or 404 if not found
      operationId: get_item_by_name
      parameters:
        - name: group
          in: path
          description: >-
            The API group of the item.


            It corresponds to the `spec.group` field of the item's Item Type
            Definition.
          required: true
          schema:
            type: string
          example: mia-platform.eu
        - name: version
          in: path
          description: >-
            The API group version of the item.


            It corresponds to the `spec.version.name` field of the item's Item
            Type Definition.
          required: true
          schema:
            type: string
          example: v1alpha1
        - name: family
          in: path
          description: >-
            The family of the item.


            It corresponds to the `spec.names.plural` field of the item's Item
            Type Definition.
          required: true
          schema:
            type: string
          example: services
        - name: name
          in: path
          description: |-
            The name of the item.

            It corresponds to the `metadata.name` field of the item.
          required: true
          schema:
            type: string
          example: my-service
        - name: Accept
          in: header
          description: >-
            Specifies the desired response format. Supported values are:

            - `application/json` (equivalent to `application/*`, `*/*`, or an
            absent `Accept` header) for a full object response,

            - `application/json;as=PartialObjectMetadata` for a partial response
            that includes only metadata.
          required: false
          schema:
            type: string
            enum:
              - application/json;as=PartialObjectMetadata
              - application/json
              - application/*
              - '*/*'
        - name: x-catalog-org
          in: header
          description: >-
            Identifier of the organization in the context of which the action
            should be performed.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Requested item provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.Item'
            application/json;as=PartialObjectMetadata:
              schema:
                $ref: >-
                  #/components/schemas/miaplatform.eu.v1alpha1.PartialObjectMetadata
        '400':
          description: Request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        '404':
          description: Requested item does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        '406':
          description: Accept header value is not supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        5XX:
          description: Server-side error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
    put:
      tags:
        - items
      summary: Create or update an item
      description: >-
        Create a new Catalog item or update an existing one by type coordinates and name.

        Use this to register a new item or modify an existing item of a known type. The item type must already exist as an Item Type Definition; use `upsert_itd` first if needed. To update only custom fields on an existing item, use `patch_item_custom_fields` instead.

        Constraints:
          - `metadata.name` in the body must match the `name` path parameter
          - `apiVersion` and `kind` in the body must match the values defined by the ITD identified by `group`, `version`, and `family`
          - For updates, `resourceVersion` in the body must match the current stored value to avoid 409 Conflict
          - `customFields` in the body is ignored; use `patch_item_custom_fields` to manage custom fields

        Args:
          - group: API group of the item type (e.g., `mia-platform.eu`). Matches `spec.group` of the ITD
          - version: API version of the item type (e.g., `v1alpha1`). Matches `spec.versions[].name` of the ITD
          - family: Plural resource name of the item type (e.g., `services`). Matches `spec.names.plural` of the ITD
          - name: The `metadata.name` of the item (e.g., `my-service`)
          - body: Full item object conforming to the `Item` schema

        Returns:
          The created (201) or updated (200) item, or 404 if the ITD does not exist
      operationId: upsert_item
      parameters:
        - name: group
          in: path
          description: >-
            The API group of the item.


            It corresponds to the `spec.group` field of the item's Item Type
            Definition.
          required: true
          schema:
            type: string
          example: mia-platform.eu
        - name: version
          in: path
          description: >-
            The API group version of the item.


            It corresponds to the `spec.version.name` field of the item's Item
            Type Definition.
          required: true
          schema:
            type: string
          example: v1alpha1
        - name: family
          in: path
          description: >-
            The family of the item.


            It corresponds to the `spec.names.plural` field of the item's Item
            Type Definition.
          required: true
          schema:
            type: string
          example: services
        - name: name
          in: path
          description: |-
            The name of the item.

            It corresponds to the `metadata.name` field of the item.
          required: true
          schema:
            type: string
          example: my-service
        - name: x-catalog-org
          in: header
          description: >-
            Identifier of the organization in the context of which the action
            should be performed.
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/miaplatform.eu.v1alpha1.Item'
        required: true
      responses:
        '200':
          description: Item updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.Item'
        '201':
          description: Item created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.Item'
        '400':
          description: Request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        '404':
          description: Requested item's Item Type Definition not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        '409':
          description: >-
            Conflict between the resource version in the body and the current
            resource version of the item in case of an update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        5XX:
          description: Server-side error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
    delete:
      tags:
        - items
      summary: Delete item by name
      description: >-
        Delete a single Catalog item by its type coordinates and name.

        Use this to permanently remove a specific item from the Catalog. To remove an entire item type and all its items at once, use `delete_itd_by_name` instead.

        Args:
          - group: API group of the item type (e.g., `mia-platform.eu`). Matches `spec.group` of the ITD
          - version: API version of the item type (e.g., `v1alpha1`). Matches `spec.versions[].name` of the ITD
          - family: Plural resource name of the item type (e.g., `services`). Matches `spec.names.plural` of the ITD
          - name: The `metadata.name` of the item to delete (e.g., `my-service`)
          - resourceVersion: Optional concurrency control token. If provided, deletion only proceeds if it matches the current resource version; otherwise returns 409 Conflict

        Returns:
          204 No Content on success, or 404 if the item does not exist
      operationId: delete_item_by_name
      parameters:
        - name: group
          in: path
          description: >-
            The API group of the item.


            It corresponds to the `spec.group` field of the item's Item Type
            Definition.
          required: true
          schema:
            type: string
          example: mia-platform.eu
        - name: version
          in: path
          description: >-
            The API group version of the item.


            It corresponds to the `spec.version.name` field of the item's Item
            Type Definition.
          required: true
          schema:
            type: string
          example: v1alpha1
        - name: family
          in: path
          description: >-
            The family of the item.


            It corresponds to the `spec.names.plural` field of the item's Item
            Type Definition.
          required: true
          schema:
            type: string
          example: services
        - name: name
          in: path
          description: |-
            The name of the item.

            It corresponds to the `metadata.name` field of the item.
          required: true
          schema:
            type: string
          example: my-service
        - name: resourceVersion
          in: query
          description: >-
            The resource version for optional concurrency control.


            If provided, the item will be deleted only if its current resource
            version (`resourceVersion` root field) matches the given one.

            If they do not match, a `409 Conflict` error will be returned.
          required: false
          schema:
            type:
              - string
              - 'null'
        - name: x-catalog-org
          in: header
          description: >-
            Identifier of the organization in the context of which the action
            should be performed.
          required: false
          schema:
            type: string
      responses:
        '204':
          description: Requested item deleted.
        '400':
          description: Request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        '404':
          description: Requested item does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        '409':
          description: >-
            Conflict between resource version provided in the query parameters
            and the current resource version of the item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        5XX:
          description: Server-side error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
  
  '/api/catalog/{group}/{version}/items/{family}/{name}/custom-fields':
    patch:
      tags:
        - items
      summary: Patch an item's custom fields
      description: >-
        Patch the custom fields of an existing Catalog item using JSON Merge Patch semantics (RFC 7396).

        Use this to add, replace, or remove entries in an item's `customFields` map without modifying the rest of the item. To update standard item fields, use `upsert_item` instead.

        Patch semantics (restricted to top-level keys of the `customFields` map):
          - A key with a non-null value is inserted (if absent) or replaced (if present)
          - A key with a `null` value is removed from the map
          - Keys not mentioned are left unchanged

        Constraints:
          - Request `Content-Type` must be `application/merge-patch+json`; other values return 415
          - Each non-null key must correspond to a registered `CustomField` entity applicable to this item type; unknown keys return 400
          - Values are validated against the JSON Schema in the matching `CustomField`'s `spec.schema`; the first invalid value returns 400
          - Custom fields are not supported for the following item types (returns 422):
              - Relationships (group `mia-platform.eu`, version `v1alpha1`, family `relationships`)
              - Relationship Types (group `mia-platform.eu`, version `v1alpha1`, family `relationship-types`)
              - Relationship Constraints (group `mia-platform.eu`, version `v1alpha1`, family `relationship-constraints`)

        Args:
          - group: API group of the item type (e.g., `mia-platform.eu`). Matches `spec.group` of the ITD
          - version: API version of the item type (e.g., `v1alpha1`). Matches `spec.versions[].name` of the ITD
          - family: Plural resource name of the item type (e.g., `services`). Matches `spec.names.plural` of the ITD
          - name: The `metadata.name` of the item to patch (e.g., `my-service`)
          - resourceVersion: Optional concurrency control token. If provided, patch only proceeds if it matches the current resource version; otherwise returns 409 Conflict
          - body: JSON object with the custom fields patch (key-value pairs; null values remove the key)

        Returns:
          The updated item with the patched custom fields, or 404 if the item does not exist
      operationId: patch_item_custom_fields
      parameters:
        - name: group
          in: path
          description: >-
            The API group of the item.


            It corresponds to the `spec.group` field of the item's Item Type
            Definition.
          required: true
          schema:
            type: string
          example: mia-platform.eu
        - name: version
          in: path
          description: >-
            The API group version of the item.


            It corresponds to the `spec.version.name` field of the item's Item
            Type Definition.
          required: true
          schema:
            type: string
          example: v1alpha1
        - name: family
          in: path
          description: >-
            The family of the item.


            It corresponds to the `spec.names.plural` field of the item's Item
            Type Definition.
          required: true
          schema:
            type: string
          example: services
        - name: name
          in: path
          description: |-
            The name of the item.

            It corresponds to the `metadata.name` field of the item.
          required: true
          schema:
            type: string
          example: my-service
        - name: x-catalog-org
          in: header
          description: >-
            Identifier of the organization in the context of which the action
            should be performed.
          required: false
          schema:
            type: string
        - name: resourceVersion
          in: query
          description: >-
            The resource version for optional concurrency control.


            If provided, the item will be patched only if its current resource
            version (`resourceVersion` root field) matches the given one.

            If they do not match, a `409 Conflict` error will be returned.
          required: false
          schema:
            type:
              - string
              - 'null'
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: true
        required: true
      responses:
        '200':
          description: Item updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.Item'
        '400':
          description: Request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        '404':
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        '409':
          description: >-
            Conflict between the provided resource version and the current
            resource version of the item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        '415':
          description: Content-Type is not 'application/merge-patch+json'.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'
        '422':
          description: The operation cannot be performed on this kind of entity.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  status:
                    type: integer
                    format: int32
                    minimum: 0
        5XX:
          description: Server-side error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/miaplatform.eu.v1alpha1.StatusResponse'

components:
  schemas:
    MergePatchBodySchema:
      type: object
      additionalProperties: true
    miaplatform.eu.v1alpha1.Item:
      type: object
      description: An entity recorded on the Catalog.
      required:
        - apiVersion
        - kind
        - metadata
        - spec
      properties:
        apiVersion:
          type: string
          description: The versioned schema of this representation of an object.
          examples:
            - stable.example.com/v1alpha1
          pattern: >-
            ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])*)*/v[0-9]+(alpha[0-9]+|beta[0-9]+)?$
        customFields:
          type:
            - object
            - 'null'
          description: >-
            A map of custom fields that can be used to store additional
            information about this object.


            Custom fields are registered in the system as entities of kind
            `CustomField` (`custom-fields.mia-platform.eu`).

            The key of each entry in this map corresponds to the `spec.key` of a
            `CustomField` entity, and the value should conform to the schema
            defined in the `spec.schema` field of that entity. However, clients
            should not give for granted the existence of the `CustomField`
            entities nor the validity of the data in this map, and should handle
            it accordingly.
          additionalProperties: {}
          propertyNames:
            type: string
        kind:
          type: string
          description: The type of this object.
          examples:
            - DockerImage
          pattern: '^[a-zA-Z][a-zA-Z0-9]*$'
        metadata:
          $ref: '#/components/schemas/miaplatform.eu.v1alpha1.ObjectMetadata'
        resourceVersion:
          type:
            - string

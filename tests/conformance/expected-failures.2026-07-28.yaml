# Conformance baseline — MCP revision 2026-07-28.
#
# Read core §12.2 first, then this. The plan expected a baseline with "one entry, one reason"
# covering the four capabilities we deliberately do not implement. The suite turned out to be
# **fixture-driven**: most scenarios require the server under test to ship a named diagnostic
# tool, resource or prompt (`test_simple_text`, `test_missing_capability`, ...), which an
# SDK example server has and a production server deliberately does not. Every entry below is
# therefore one of exactly three things, and none of them is a protocol defect:
#
#   (a) a capability D5 does not declare — prompts, resources, completions;
#   (b) an extension the plan puts out of scope — tasks (SEP-2663), MRTR / input-required;
#   (c) a scenario that needs a diagnostic tool we do not ship.
#
# Entries are per **check**, not per scenario, so that every other check in the same scenario
# stays enforced — `server-stateless` alone is thirty checks, and twenty-one of them pass.
#
# What this baseline does NOT excuse, and what therefore still guards us:
#   - every wire-schema check: every message we send validates against the spec JSON schema;
#   - `tools-list` (3/3), which is the payload we author;
#   - `http-header-validation` (14/14) — SEP-2243 `Mcp-Method` / `Mcp-Name` / `Mcp-Param-*`;
#   - `dns-rebinding-protection` (2/2) — D11's Host allowlist, our configuration;
#   - `caching` cache-hint checks for `tools/list` and `server/discover` — D13;
#   - 21 of the 25 `server-stateless` checks — per-request `_meta`, version negotiation,
#     header mismatch, method routing, request-id preservation.
#
# Regenerate with `cargo make conformance_record`; review every added line as code.

server:
  # (a) Capabilities D5 does not declare. `tools` only: no resources, prompts, completions,
  #     logging — therefore no `subscriptions/listen` and no `notifications/tools/list_changed`.
  - completion-complete:completion-complete
  - prompts-list:prompts-list
  - prompts-get-simple:prompts-get-simple
  - prompts-get-with-args:prompts-get-with-args
  - prompts-get-embedded-resource:prompts-get-embedded-resource
  - prompts-get-with-image:prompts-get-with-image
  - resources-list:resources-list
  - resources-read-text:resources-read-text
  - resources-read-binary:resources-read-binary
  - resources-templates-read:resources-templates-read
  - caching:sep-2549-prompts-list-caching-hints
  - caching:sep-2549-resources-list-caching-hints
  - caching:sep-2549-resources-templates-list-caching-hints
  # Reported as WARNING rather than FAILURE, but still counted: SEP-2164 is a `resources/read`
  # requirement, and we declare no resources capability.
  - sep-2164-resource-not-found:sep-2164-error-code
  - sep-2164-resource-not-found:sep-2164-data-uri
  - server-stateless:sep-2575-server-no-log-without-loglevel

  # (b) Extensions the plan puts out of scope: MRTR (`resultType: "input_required"`),
  #     elicitation, sampling, roots, and the SEP-2663 tasks extension. `call_tool` always
  #     returns a complete result.
  - input-required-result-basic-elicitation:sep-2322-elicitation-incomplete
  - input-required-result-basic-sampling:sep-2322-sampling-incomplete
  - input-required-result-basic-list-roots:sep-2322-list-roots-incomplete
  - input-required-result-capability-check:sep-2322-respect-client-capabilities
  - input-required-result-multi-round:sep-2322-multi-round-r1
  - input-required-result-multiple-input-requests:sep-2322-multiple-inputs-incomplete
  - input-required-result-non-tool-request:sep-2322-non-tool-incomplete
  - input-required-result-request-state:sep-2322-request-state-incomplete
  - input-required-result-result-type:sep-2322-result-type-included
  - input-required-result-tampered-state:sep-2322-reject-tampered-state
  # Reported as WARNING rather than FAILURE — the suite still counts the scenario as not
  # passing, so the entry is needed. Same reason as the rows above: no MRTR.
  - input-required-result-missing-input-response:sep-2322-missing-response-rerequests
  - input-required-result-ignore-extra-params:sep-2322-ignore-unexpected-params
  - tasks-capability-negotiation:tasks-extension-advertised
  - tasks-capability-negotiation:sep-2663-tasks-methods-non-declaring
  - tasks-capability-negotiation:sep-2663-server-rejects-undeclared-client
  - tasks-capability-negotiation:tasks-per-request-meta-opt-in
  - tasks-dispatch-and-envelope:tasks-server-directed-creation-no-hint
  - tasks-dispatch-and-envelope:sep-2663-legacy-task-param-ignored
  - tasks-dispatch-and-envelope:tasks-immediate-result-shortcut
  - tasks-dispatch-and-envelope:tasks-result-type-complete-on-non-task-responses
  - tasks-dispatch-and-envelope:sep-2663-durable-create-strong-consistency
  - tasks-dispatch-and-envelope:sep-2663-tasks-get-invalid-task-id-32602
  - tasks-lifecycle:tasks-sync-tool-call
  - tasks-lifecycle:sep-2663-result-type-task-on-create
  - tasks-lifecycle:sep-2663-tasks-get-status-working
  - tasks-lifecycle:sep-2663-tasks-get-status-completed
  - tasks-lifecycle:sep-2663-tool-error-uses-completed-status
  - tasks-lifecycle:sep-2663-tasks-get-status-failed
  - tasks-lifecycle:sep-2663-cancel-ack-empty-result
  - tasks-lifecycle:tasks-cancel-terminal-idempotent-ack
  - tasks-mrtr-composition:sep-2663-mrtr-synchronous-before-task-creation
  - tasks-mrtr-input:sep-2663-tasks-get-status-input-required
  - tasks-mrtr-input:tasks-mrtr-tasks-update-resumes
  - tasks-mrtr-input:tasks-mrtr-partial-fulfillment
  - tasks-request-headers:tasks-headers-tolerate-mcp-method-on-tools-call
  - tasks-request-headers:sep-2663-routing-headers-accepted-on-tasks-get
  - tasks-request-headers:sep-2663-server-rejects-mismatched-mcp-name-on-tasks-get
  - tasks-request-state-removal:tasks-request-state-removal-setup
  - tasks-required-task-error:sep-2663-server-returns-missing-capability-when-required
  - tasks-wire-fields:tasks-wire-field-renames
  - tasks-wire-fields:tasks-no-early-ttl-expiry
  - tasks-wire-fields:tasks-no-related-task-meta-on-inlined-result

  # (c) Scenarios that require a diagnostic tool the suite defines and we do not ship
  #     (`test_simple_text`, `test_image`, `test_audio`, `test_error`, `test_mixed_content`,
  #     `test_with_progress`, `test_missing_capability`, a 2020-12-schema tool). Our tool set is
  #     the catalog's, not the suite's, so these are untestable rather than failing.
  - tools-call-simple-text:tools-call-simple-text
  - tools-call-image:tools-call-image
  - tools-call-audio:tools-call-audio
  - tools-call-embedded-resource:tools-call-embedded-resource
  - tools-call-mixed-content:tools-call-mixed-content
  - tools-call-error:tools-call-error
  - tools-call-with-progress:tools-call-with-progress
  - json-schema-2020-12:json-schema-2020-12-tool-found
  - server-stateless:sep-2575-server-rejects-undeclared-capability
  - server-stateless:sep-2575-missing-capability-http-400
  - server-stateless:sep-2575-http-server-no-independent-requests-on-stream

  # D8 — we publish no `x-mcp-header` annotation, deliberately: publishing one obliges a client
  # to mirror a parameter into a header and obliges us to reject the request when it does not.
  # Cost with no benefit here, and a standing invitation to leak an argument into a header.
  - http-custom-header-server-validation:sep-2243-server-no-xmcp-tool
  - http-custom-header-server-validation:sep-2243-server-decode-base64
  - http-custom-header-server-validation:sep-2243-server-validate-param-match
  - http-custom-header-server-validation:sep-2243-server-reject-invalid-param-chars
  - http-custom-header-server-validation:sep-2243-server-reject-param-mismatch

# The e2e environment (§14): a real `catalog-engine` on a real database.
#
# It is where the client is checked against the engine: there is no vendored OAS to test against,
# by decision, so what the engine actually does is the contract. That includes two things no
# document could express anyway — the `Warning: 299` header, which the OAS declares nowhere, and
# the relationships endpoint's three response shapes, whose `200` body is typed as a free-form
# object (§8.3, §12.3, §17.4).
#
# The gateway is deliberately **absent**. In production every outbound call traverses it so
# `ext_authz` re-authorizes the operation (D27, D48); here there is no policy to run, so the
# engine sees exactly the headers this client forwards — which is what makes the run a true test
# of D26's propagation rather than of the policy's regeneration.

name: catalog-mcp-server-e2e

services:
  postgres:
    image: docker.io/postgres:18-alpine
    container_name: postgres4catalog-mcp-server-e2e
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=""
      - POSTGRES_DB=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ./e2e/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 2s
      timeout: 5s
      retries: 15

  catalog-engine:
    image: nexus.mia-platform.eu/catalog/catalog-engine:0.9.2
    platform: linux/amd64
    pull_policy: if_not_present
    container_name: catalog-engine4catalog-mcp-server-e2e
    ports:
      - "3100:3000"
    environment:
      - LOG_LEVEL=info
      - CONFIGURATION_FOLDER=/config
    volumes:
      - ./e2e/catalog-engine.config.json:/config/config.json:ro
    networks:
      - ring
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/-/ready | grep -q OK"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

networks:
  ring:
